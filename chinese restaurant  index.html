        // --- UPGRADED SWIPEABLE FAN DECK COMPONENT WITH REAL DRAG/SWIPE PHYSICS ---
        const FanDeck = ({ items, lang, onSelectDish }) => {
            const [activeIndex, setActiveIndex] = useState(0);

            const handleDragEnd = (e, info) => {
                const threshold = 50;
                if (info.offset.x > threshold) {
                    setActiveIndex((prev) => (prev - 1 + items.length) % items.length);
                } else if (info.offset.x < -threshold) {
                    setActiveIndex((prev) => (prev + 1) % items.length);
                }
            };

            if (items.length === 0) return null;

            return (
                <div className="relative w-full max-w-md mx-auto py-2 px-2">
                    <div className="text-center mb-5">
                        <span className="inline-block text-[10px] tracking-[0.2em] uppercase text-mosch-red bg-mosch-red/10 border border-mosch-red/30 px-4 py-1.5 rounded-full font-semibold">
                            {COPY[lang].swipeHint}
                        </span>
                    </div>

                    <div className="relative h-[480px] sm:h-[510px] w-full flex items-center justify-center overflow-hidden">
                        {items.map((dish, idx) => {
                            const offset = (idx - activeIndex + items.length) % items.length;
                            const displayOffset = offset > items.length / 2 ? offset - items.length : offset;
                            
                            const isActive = displayOffset === 0;
                            const isVisible = Math.abs(displayOffset) <= 2;

                            if (!isVisible) return null;

                            return (
                                <motion.div
                                    key={dish.id}
                                    drag={isActive ? "x" : false}
                                    dragConstraints={{ left: 0, right: 0 }}
                                    dragElastic={0.9}
                                    onDragEnd={handleDragEnd}
                                    onClick={() => {
                                        if (isActive) {
                                            onSelectDish(dish);
                                        } else {
                                            setActiveIndex(idx);
                                        }
                                    }}
                                    animate={{
                                        x: displayOffset * 48,
                                        y: Math.abs(displayOffset) * 12,
                                        rotate: displayOffset * 5,
                                        scale: isActive ? 1 : 0.88 - Math.abs(displayOffset) * 0.04,
                                        zIndex: 50 - Math.abs(displayOffset),
                                        opacity: Math.abs(displayOffset) > 2 ? 0 : 1 - Math.abs(displayOffset) * 0.22
                                    }}
                                    transition={{ type: "spring", stiffness: 300, damping: 25 }}
                                    className={`absolute top-0 w-[310px] sm:w-[345px] h-[460px] sm:h-[490px] rounded-3xl p-5 bg-card-bg border ${
                                        isActive

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
